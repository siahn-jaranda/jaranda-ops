<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자란다 OPS — 매칭 신청서</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color: #1E2530; background: #F7F8FA;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-feature-settings: "ss01","ss02";
}
button { font-family: inherit; border: none; background: none; padding: 0; cursor: pointer; color: inherit; }
input, textarea, select { font-family: inherit; }
::selection { background: #D8E4FB; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #D8DDE3; border-radius: 999px; border: 2px solid #F7F8FA; }
::-webkit-scrollbar-track { background: transparent; }

/* ===== HEADER ===== */
.topbar {
  background: #fff; border-bottom: 1px solid #E5E8EC;
  padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 28px; }
.brand-block { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px; background: #1B4FB8;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 13px; letter-spacing: -0.02em;
}
.brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #0F172A; }
.brand-name .sub { color: #6B7280; font-weight: 600; }
.beta-badge {
  font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
  background: #EEF1F4; color: #4B5563; letter-spacing: 0.04em;
}
.tabs {
  display: flex; gap: 4px; padding: 4px;
  background: #F4F6F8; border-radius: 10px;
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.search-wrap { position: relative; }
.search-wrap input {
  background: #F4F6F8; border: 1px solid transparent; border-radius: 8px;
  padding: 8px 12px 8px 32px; font-size: 13px; width: 220px;
  color: #1E2530; outline: none;
}
.search-wrap input:focus { border-color: #1B4FB8; background: #fff; }
.search-wrap .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .5; }
.avatar {
  width: 32px; height: 32px; border-radius: 999px; background: #1B4FB8; color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12.5px; margin-left: 4px;
}
.avatar.gray { background: #EEF1F4; color: #4B5563; width: 20px; height: 20px; font-size: 10px; }

/* ===== BTN (atomic) ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; font-size: 13px; font-weight: 600;
  border-radius: 8px; cursor: pointer; letter-spacing: -0.01em;
  transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  border: 1px solid transparent; line-height: 1.2; white-space: nowrap;
}
.btn .icon { font-size: 12px; opacity: .9; }
.btn-sm { padding: 6px 10px; font-size: 12px; gap: 5px; border-radius: 6px; }
.btn-lg { padding: 10px 18px; font-size: 14px; gap: 8px; border-radius: 9px; }
.btn-primary { background: #1B4FB8; color: #fff; border-color: #1B4FB8; }
.btn-primary:hover { background: #0F2B6E; border-color: #0F2B6E; }
.btn-secondary { background: #fff; color: #1E2530; border-color: #D8DDE3; }
.btn-secondary:hover { background: #F4F6F8; }
.btn-ghost { background: transparent; color: #1E2530; }
.btn-ghost:hover { background: #EEF1F4; }
.btn-danger { background: #fff; color: #A4271A; border-color: #F0C8C2; }
.btn-danger:hover { background: #FBE0DC; }
.btn-tab {
  background: transparent; color: #6B7280;
  padding: 8px 14px; font-size: 13px; font-weight: 550;
  border-radius: 6px; border: 1px solid transparent;
}
.btn-tab:hover { background: #F4F6F8; color: #1E2530; }
.btn-tab.active {
  background: #fff; color: #1E2530; border-color: #D8DDE3;
  box-shadow: 0 1px 2px rgba(15,23,42,0.06);
}

/* ===== TOOLBAR ===== */
.main-pad { padding: 0 28px 28px; }
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0; gap: 16px; flex-wrap: wrap;
}
.toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #0F172A; }
.count-chip {
  font-size: 12.5px; color: #1B4FB8; background: #E8F0FE;
  padding: 3px 8px; border-radius: 999px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.divider-v { height: 18px; width: 1px; background: #E5E8EC; }
.seg-group {
  display: flex; gap: 2px; padding: 3px; background: #F4F6F8; border-radius: 8px;
}
.seg-btn {
  padding: 6px 12px; font-size: 12.5px; font-weight: 600;
  color: #6B7280; border-radius: 6px;
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid transparent;
}
.seg-btn:hover { color: #1E2530; }
.seg-btn.active {
  background: #fff; color: #0F172A; border-color: #D8DDE3;
  box-shadow: 0 1px 2px rgba(15,23,42,0.06);
}
.seg-btn .icon { font-size: 11px; }
.dropdown { position: relative; }
.dropdown-trigger {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 11px; font-size: 12.5px; font-weight: 600;
  background: #fff; border: 1px solid #D8DDE3; border-radius: 8px;
  color: #1E2530;
}
.dropdown-trigger .label { color: #6B7280; }
.dropdown-trigger .caret { font-size: 9px; opacity: .6; }
.dropdown-menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
  background: #fff; border: 1px solid #E5E8EC; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(15,23,42,0.08); padding: 4px; min-width: 140px;
}
.dropdown-menu button {
  display: block; width: 100%; text-align: left;
  padding: 7px 10px; font-size: 12.5px; font-weight: 500;
  color: #1E2530; border-radius: 6px;
}
.dropdown-menu button.active { background: #F4F8FF; font-weight: 700; }
.dropdown-menu button:hover { background: #F4F6F8; }

/* ===== LAYOUT GRID ===== */
.list-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) 380px;
  gap: 20px; align-items: start;
}
.list-grid.full { grid-template-columns: 1fr; }

/* ===== CARD VIEW ===== */
.cards { display: grid; gap: 12px; padding: 4px 0; }
.app-card {
  background: #fff; border: 1px solid #E5E8EC; border-radius: 12px;
  padding: 18px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1.5fr) minmax(0,0.8fr);
  gap: 18px; align-items: stretch;
  transition: box-shadow 120ms ease, border-color 120ms ease;
}
.app-card.selected {
  border-color: #1B4FB8;
  box-shadow: 0 0 0 3px rgba(27,79,184,0.12);
}
.col-identity { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.id-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.id-name-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.id-name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: #0F172A; }
.id-tag {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
  padding: 2px 6px; border-radius: 4px;
}
.id-tag.tag-new { background: #EEF1F4; color: #4B5563; }
.id-tag.tag-rebook { background: #E4F5EA; color: #1F6B3C; }
.id-child { font-size: 12.5px; color: #6B7280; }
.id-body { font-size: 12.5px; color: #4B5563; line-height: 1.5; }
.id-body .region { color: #6B7280; margin-top: 2px; }

.col-rec {
  background: #FAFBFC; border-radius: 10px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
  border: 1px solid #EEF1F4;
}
.rec-head { display: flex; align-items: center; justify-content: space-between; }
.section-label {
  font-size: 10.5px; font-weight: 700; color: #6B7280;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.teacher-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
.teacher-line .lbl { font-size: 10.5px; font-weight: 700; color: #6B7280; width: 34px; flex-shrink: 0; }
.teacher-line .name { flex: 1; min-width: 0; font-size: 12.5px; color: #1E2530; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.teacher-line .name.empty { color: #9CA3AF; font-weight: 500; }
.teacher-line .state-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; flex-shrink: 0; }
.teacher-line .state-dot .dot { width: 6px; height: 6px; border-radius: 999px; }

.col-priority {
  display: flex; flex-direction: column; gap: 10px;
  align-items: flex-end; justify-content: space-between;
}
.col-priority .top { width: 100%; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.owner-line { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #6B7280; }
.action-row { display: flex; gap: 6px; }

/* ===== ATOMIC: StatusBadge ===== */
.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  letter-spacing: -0.01em; line-height: 1;
}
.status-badge.sm { padding: 3px 8px; font-size: 11px; }
.status-badge .dot { width: 6px; height: 6px; border-radius: 999px; }
.tone-blue { background: #E8F0FE; color: #1B4FB8; }
.tone-blue .dot { background: #1B4FB8; }
.tone-green { background: #E4F5EA; color: #1F6B3C; }
.tone-green .dot { background: #1F6B3C; }
.tone-orange { background: #FCE9DD; color: #B43F18; }
.tone-orange .dot { background: #B43F18; }
.tone-amber { background: #FDF0CC; color: #8A5B00; }
.tone-amber .dot { background: #8A5B00; }
.tone-red { background: #FBE0DC; color: #A4271A; }
.tone-red .dot { background: #A4271A; }
.tone-purple { background: #EDE7FB; color: #4634A8; }
.tone-purple .dot { background: #4634A8; }
.tone-slate { background: #EEF1F4; color: #4B5563; }
.tone-slate .dot { background: #4B5563; }

/* ===== RecPill ===== */
.rec-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 8px;
  font-size: 12.5px; font-weight: 600; line-height: 1.1; white-space: nowrap;
}
.rec-pill.compact { padding: 4px 8px; font-size: 11.5px; }
.rec-pill .glyph { font-size: 9px; line-height: 1; }
.rec-pill .label { opacity: .7; font-weight: 500; }

/* ===== DeadlineTag ===== */
.dl-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px; border-radius: 6px;
  font-size: 11.5px; font-weight: 600;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.dl-tag .icon { font-size: 11px; }
.dl-urgent { background: #FBE0DC; color: #A4271A; }
.dl-soon { background: #FDF0CC; color: #8A5B00; }
.dl-ok { background: #EEF1F4; color: #4B5563; }

/* ===== ProbBar ===== */
.prob-bar { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.prob-bar.compact { min-width: 80px; }
.prob-bar .track { flex: 1; height: 6px; background: #EEF1F4; border-radius: 999px; overflow: hidden; }
.prob-bar .fill { height: 100%; border-radius: 999px; }
.prob-bar .val { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
.prob-bar .val .pct { font-size: 10px; font-weight: 500; opacity: .7; }

/* ===== ViewedBadge / Eye ===== */
.viewed-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 7px; border-radius: 5px;
  font-size: 11px; font-weight: 700; letter-spacing: -0.01em;
  line-height: 1; white-space: nowrap;
}
.viewed-badge.sm { padding: 2px 6px; font-size: 10.5px; }
.viewed-yes { background: #E4F5EA; color: #1F6B3C; }
.viewed-no { background: #FBE0DC; color: #A4271A; }
.viewed-summary {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 6px;
  font-size: 11.5px; font-weight: 700; line-height: 1; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* ===== TABLE VIEW ===== */
.table-card {
  background: #fff; border: 1px solid #E5E8EC; border-radius: 12px;
  overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,0.04);
}
.table-head {
  display: grid; grid-template-columns: 120px 1.2fr 1fr 1.4fr 130px 110px 80px;
  gap: 12px; padding: 10px 14px;
  background: #FAFBFC; border-bottom: 1px solid #E5E8EC;
  font-size: 10.5px; font-weight: 700; color: #6B7280;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.table-row {
  display: grid; grid-template-columns: 120px 1.2fr 1fr 1.4fr 130px 110px 80px;
  gap: 12px; padding: 14px 14px; align-items: center;
  border-bottom: 1px solid #EEF1F4; cursor: pointer;
  transition: background 100ms ease;
}
.table-row:last-child { border-bottom: none; }
.table-row:hover { background: #FAFBFC; }
.table-row.selected { background: #F4F8FF; }
.tr-name { font-size: 14px; font-weight: 700; color: #0F172A; letter-spacing: -0.01em; }
.tr-name .sub { color: #6B7280; font-weight: 500; }
.tr-meta { font-size: 12px; color: #6B7280; margin-top: 2px; }
.tr-recv { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
.compact-teacher { display: flex; align-items: center; gap: 6px; font-size: 11.5px; min-width: 0; }
.compact-teacher .lbl-box {
  width: 14px; height: 14px; border-radius: 4px; background: #EEF1F4; color: #6B7280;
  font-size: 9.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.compact-teacher .nm { min-width: 0; flex: 1; color: #1E2530; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.compact-teacher .nm.empty { color: #9CA3AF; }
.compact-teacher .state { font-weight: 600; font-size: 11px; flex-shrink: 0; }
.compact-teacher .eye { display: inline-flex; flex-shrink: 0; }

/* ===== KANBAN ===== */
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kb-col {
  background: #FAFBFC; border-radius: 12px; padding: 12px;
  border: 1px solid #EEF1F4;
  display: flex; flex-direction: column; gap: 10px; min-height: 240px;
}
.kb-col-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.kb-col-head .label { display: flex; align-items: center; gap: 8px; }
.kb-col-head .label .dot { width: 8px; height: 8px; border-radius: 999px; }
.kb-col-head .label .name { font-size: 12.5px; font-weight: 700; color: #1E2530; }
.kb-col-head .count {
  font-size: 11px; font-weight: 600; color: #6B7280;
  background: #fff; padding: 2px 7px; border-radius: 999px; border: 1px solid #E5E8EC;
}
.kb-empty {
  font-size: 11.5px; color: #9CA3AF; text-align: center; padding: 30px 8px;
  border: 1px dashed #E5E8EC; border-radius: 8px;
}
.kb-card {
  background: #fff; border-radius: 9px; padding: 13px;
  border: 1px solid #E5E8EC; box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  cursor: pointer; display: flex; flex-direction: column; gap: 8px;
}
.kb-card.selected { border-color: #1B4FB8; box-shadow: 0 0 0 3px rgba(27,79,184,0.12); }
.kb-card .header-row { display: flex; align-items: center; justify-content: space-between; }
.kb-card .name { font-size: 14px; font-weight: 700; color: #0F172A; letter-spacing: -0.01em; }
.kb-card .name .sub { color: #6B7280; font-size: 12px; font-weight: 500; }
.kb-card .meta { font-size: 11.5px; color: #6B7280; margin-top: 2px; }
.kb-card .rec-box {
  display: flex; flex-direction: column; gap: 4px;
  background: #FAFBFC; border-radius: 6px; padding: 8px 10px; border: 1px solid #EEF1F4;
}
.kb-card .footer { display: flex; align-items: center; justify-content: space-between; padding-top: 2px; font-size: 10.5px; color: #6B7280; }

/* ===== DETAIL PANEL ===== */
.detail-empty {
  background: #FAFBFC; border: 1px dashed #E5E8EC; border-radius: 12px;
  padding: 60px 24px; text-align: center; color: #9CA3AF; font-size: 13px;
  position: sticky; top: 90px;
}
.detail-empty .ic { font-size: 22px; margin-bottom: 8px; opacity: .5; }
.detail-panel {
  background: #fff; border: 1px solid #E5E8EC; border-radius: 12px;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  display: flex; flex-direction: column; overflow: hidden;
  position: sticky; top: 90px; max-height: calc(100vh - 110px);
}
.dp-head {
  padding: 16px 18px; border-bottom: 1px solid #EEF1F4;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.dp-head .id-line { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dp-head .id { font-size: 11px; color: #9CA3AF; font-variant-numeric: tabular-nums; }
.dp-head .name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #0F172A; }
.dp-head .name .sub { color: #6B7280; font-weight: 500; font-size: 14px; }
.dp-head .sub-line { font-size: 12.5px; color: #6B7280; margin-top: 4px; }
.dp-close { font-size: 18px; color: #9CA3AF; padding: 4px; line-height: 1; }
.dp-body { padding: 18px; display: flex; flex-direction: column; gap: 18px; overflow: auto; }
.dp-section { display: flex; flex-direction: column; gap: 10px; }
.dp-section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 0; }
.kv .k { font-size: 12px; color: #6B7280; }
.kv .v { font-size: 12.5px; color: #1E2530; }
.teacher-card {
  background: #FAFBFC; border: 1px solid #EEF1F4; border-radius: 9px;
  padding: 10px 12px; display: flex; align-items: center; gap: 10px;
}
.teacher-card .av {
  width: 30px; height: 30px; border-radius: 999px;
  background: #E8F0FE; color: #1B4FB8;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px; flex-shrink: 0;
}
.teacher-card .av.empty { background: #EEF1F4; color: #9CA3AF; }
.teacher-card .body { flex: 1; min-width: 0; }
.teacher-card .row1 { display: flex; align-items: center; gap: 6px; }
.teacher-card .row1 .lbl { font-size: 11px; font-weight: 700; color: #6B7280; letter-spacing: 0.04em; }
.teacher-card .nm { font-size: 13px; font-weight: 600; color: #1E2530; margin-top: 2px; }
.teacher-card .nm.empty { color: #9CA3AF; }
.teacher-card .note { font-size: 11.5px; color: #9CA3AF; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.teacher-card .note .dim { opacity: .5; }
.teacher-card .state-tag {
  padding: 4px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; flex-shrink: 0;
}
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 11.5px; padding: 4px 9px; border-radius: 999px;
  background: #EEF1F4; color: #4B5563; font-weight: 600;
}
.dp-foot {
  padding: 14px; border-top: 1px solid #EEF1F4; background: #FAFBFC;
  display: flex; gap: 8px;
}
.dp-foot .spacer { flex: 1; }

/* ===== INSIGHT VIEW ===== */
.insight-card {
  background: #fff; border: 1px solid #E5E8EC; border-radius: 12px;
  padding: 28px; box-shadow: 0 1px 2px rgba(15,23,42,0.04);
}
.insight-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
.insight-head .sub { font-size: 12.5px; color: #6B7280; }
.insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
@media (max-width: 900px) { .insight-grid { grid-template-columns: 1fr; } }
.insight-block { border: 1px solid #EEF1F4; border-radius: 10px; padding: 16px; }
.insight-block.gray { background: #FAFBFC; }
.insight-block textarea {

function showGate(err) {

}

function updateAuthUI() {
  const emailEl = document.getElementById('auth-email');

  const avatar = document.getElementById('user-avatar');
  const slot = document.getElementById('g-signin-slot');
  if (slot) slot.style.display = 'none';
  if (authToken && authEmail) {
    emailEl.style.display = '';

function renderGoogleButton(slotId, large) {
  slotId = slotId || 'gate-signin-slot';
  if (!window.google || !google.accounts || !google.accounts.id) {
    setTimeout(() => renderGoogleButton(slotId, large), 200);
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential,
  });
  const slot = document.getElementById(slotId);
  if (slot) {
    slot.innerHTML = '';
    google.accounts.id.renderButton(slot, {
      theme: 'filled_blue',
      size: large ? 'large' : 'medium',
      text: 'signin_with',
      shape: 'rectangular',
      logo_alignment: 'left',
      width: large ? 280 : undefined,
    });
  }
}

async function handleGoogleCredential(response) {
  try {
    const r = await fetch(API_BASE + '/api/auth/google', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({credential: response.credential}),
    });
    if (!r.ok) {
      const err = await r.json().catch(()=>({detail:'unknown'}));
      showGate('로그인 실패: ' + (err.detail || r.status));
      return;
    }
    const data = await r.json();
    authToken = data.token; authEmail = data.email;
    localStorage.setItem('mo-token', authToken);
    localStorage.setItem('mo-email', authEmail);
    showApp();
    loadLiveData();
  } catch (e) {
    showGate('로그인 오류: ' + e.message);
  }
}

function logout() {
  authToken = ''; authEmail = '';
  localStorage.removeItem('mo-token');
  localStorage.removeItem('mo-email');
  showGate();
}

async function apiFetch(path) {
  if (!authToken) throw new Error('no-token');
  const r = await fetch(API_BASE + path, {
    headers: {'Authorization': 'Bearer ' + authToken},
  });
  if (r.status === 401) {
    authToken = ''; authEmail = '';
    localStorage.removeItem('mo-token');
    localStorage.removeItem('mo-email');
    updateAuthUI();
    throw new Error('unauthorized');
  }
  if (!r.ok) throw new Error('api-error ' + r.status);
  return r.json();
}

function backendToApp(r) {

  const subParts = (r.sub || '').split('·').map(s => s.trim());
  const grade = subParts[0] || '';
  const subject = subParts[1] || r.policy || '';
  let childAge = '';
  const m = grade.match(/(\d)/);
  if (grade.includes('초등')) childAge = '초' + (m ? m[1] : '');
  else if (grade.includes('중')) childAge = '중' + (m ? m[1] : '');
  else if (grade.includes('유아')) childAge = '유아';

  // 핸드오프 statusKey 매핑
  let statusKey = r.statusKey || 'recommending';
  if (r.result === '성공') statusKey = 'matched';
  else if (r.result === '실패') statusKey = 'cancelled';

  // 추천 상태/선생님
  const teachers = r.teachers || [];
  const mapTeacher = (t) => {
    if (!t) return { name: '—', stateKey: 'searching', note: '', viewed: false, viewedAt: null };
    const sk = t.stat && t.stat.includes('확정') ? 'accepted'
            : t.stat && t.stat.includes('수락') ? 'accepted'
            : t.stat && t.stat.includes('응답완료') ? 'accepted'
            : t.stat && t.stat.includes('백업') ? 'backup'
            : t.stat && t.stat.includes('거절') ? 'declined'
            : 'pending';
    return {
      name: t.name ? (t.name.endsWith('선생님') ? t.name : t.name + ' 선생님') : '—',
      stateKey: sk, note: t.resp ? '응답 ' + t.resp : (t.stat || ''),
      viewed: !!t.viewed, viewedAt: t.viewed ? '열람' : null,
    };
  };
  const responded = teachers.filter(t => t.stat && (t.stat.includes('수락') || t.stat.includes('응답완료')));
  const recStateKey = responded.length >= 1 ? 'accepted' : (teachers.length ? 'pending' : 'searching');

  const parent = (r.title || '').split('·')[1] ? (r.title.split('·')[1].replace('학부모','').trim()) : '학부모';

  return {
    id: r.sid || r.key,
    parent, parentTag: r.isNew === true ? '신규' : r.isNew === false ? '재이용' : '신규',
    child: '—', childAge,
    region: r.region || '',
    subject, schedule: (r.requestChips && r.requestChips.length) ? r.requestChips.slice(0,2).join(' · ') : '—',
    receivedAt: r.date || '',
    deadline: r.deadlineLabel || '—',
    deadlineState: r.deadlineState || 'ok',
    probability: r.prob != null ? r.prob : 0,
    owner: r.assignee || '—',
    status: r.status || '', statusKey,
    lastAction: '—',
    recommendation: {
      stateKey: recStateKey,
      t1: mapTeacher(responded[0]),
      t2: mapTeacher(responded[1]),
    },
    history: {
      rebook: r.isNew === false,
      prevTeachers: r.confirmedCount != null ? r.confirmedCount : 0,
      notes: r.isNew === true ? '신규 가입' : (r.appCount ? `재이용 ${r.appCount}회차` : '재이용'),
    },
    extras: r.requestChips || [],
    result: r.result === '성공' ? '성공' : r.result === '실패' ? '실패' : null,
  };
}

async function loadLiveData(force) {
  if (!authToken) { showGate(); return; }
  try {
    const r = await fetch(API_BASE + '/api/applications?limit=30', {
      headers: {'Authorization': 'Bearer ' + authToken},
    });
    if (r.status === 401) {
      authToken = ''; authEmail = '';
      localStorage.removeItem('mo-token');
      localStorage.removeItem('mo-email');
      showGate('세션이 만료되었습니다. 다시 로그인해주세요.');
      return;
    }
    if (!r.ok) throw new Error('api-error ' + r.status);
    const data = await r.json();
    if (data && Array.isArray(data.rows) && data.rows.length > 0) {
      APPS = data.rows.map(backendToApp);
      // 담당자 dropdown 옵션 갱신
      const owners = Array.from(new Set(APPS.map(a => a.owner).filter(Boolean)));
      state.ownerOptions = owners;
      // 첫 항목 선택
      state.selectedId = APPS[0]?.id || null;
      setDataSource('live');
      render();
    } else {
      setDataSource('mock');
    }
  } catch (e) {
    console.warn('Live data fetch failed, mock fallback:', e.message);
    setDataSource('mock');
  }
}

// ====== ATOMIC COMPONENTS ======
function statusBadge(statusKey, size) {
  const m = STATUS_META[statusKey];
  if (!m) return '';
  const sz = size === 'sm' ? 'sm' : '';
  return `<span class="status-badge ${sz} tone-${m.tone}"><span class="dot"></span>${m.label}</span>`;
}

function recPill(stateKey, name, compact) {
  const m = REC_STATE_META[stateKey];
  if (!m) return '';
  return `<span class="rec-pill ${compact?'compact':''} tone-${m.tone}">
    <span class="glyph">${m.dot}</span>
    ${name?`<span>${name}</span>`:''}
    <span class="label">${m.label}</span>
  </span>`;
}

function dlTag(deadline, stateKey) {
  const cls = stateKey === 'urgent' ? 'dl-urgent' : stateKey === 'soon' ? 'dl-soon' : 'dl-ok';
  return `<span class="dl-tag ${cls}"><span class="icon">⏱</span>${deadline}</span>`;
}

function probBar(value, compact) {
  const tone = value >= 75 ? '#1F6B3C' : value >= 55 ? '#1B4FB8' : '#B43F18';
  return `<div class="prob-bar ${compact?'compact':''}">
    <div class="track"><div class="fill" style="width:${value}%;background:${tone}"></div></div>
    <span class="val" style="color:${tone}">${value}<span class="pct">%</span></span>
  </div>`;
}

function eyeIcon(viewed, size) {
  size = size || 12;
  if (viewed) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none">
      <path d="M1.5 8 C 3.3 4.4 5.6 3 8 3 C 10.4 3 12.7 4.4 14.5 8 C 12.7 11.6 10.4 13 8 13 C 5.6 13 3.3 11.6 1.5 8 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      <circle cx="8" cy="8" r="2.2" fill="currentColor"/>
    </svg>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none">
    <path d="M1.5 8 C 3.3 4.4 5.6 3 8 3 C 10.4 3 12.7 4.4 14.5 8 C 12.7 11.6 10.4 13 8 13 C 5.6 13 3.3 11.6 1.5 8 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" opacity="0.55"/>
    <line x1="2.5" y1="13.5" x2="13.5" y2="2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </svg>`;
}

function viewedBadge(viewed, viewedAt, size) {
  const cls = viewed ? 'viewed-yes' : 'viewed-no';
  const sz = size === 'sm' ? 'sm' : '';
  const title = viewed ? `부모님 열람 · ${viewedAt||''}` : '부모님 미열람';
  return `<span class="viewed-badge ${sz} ${cls}" title="${title}">${eyeIcon(viewed, size==='sm'?10:11)}${viewed?'열람':'미열람'}</span>`;
}

function viewedSummary(rec) {
  const ts = [rec.t1, rec.t2].filter(t => t && t.name && t.name !== '—');
  const total = ts.length;
  if (total === 0) return '';
  const viewed = ts.filter(t => t.viewed).length;
  const all = viewed === total;
  const none = viewed === 0;
  const cls = all ? 'viewed-yes' : none ? 'viewed-no' : '';
  const style = !all && !none ? 'background:#FDF0CC;color:#8A5B00' : '';
  return `<span class="viewed-summary ${cls}" style="${style}" title="부모님이 선생님 프로필을 열람한 수">${eyeIcon(!none, 11)}프로필 ${viewed}/${total}</span>`;
}

// ====== APP STATE & RENDER ======
function getApps() {
  let list = APPS.slice();
  if (state.owner !== '전체') list = list.filter(a => a.owner === state.owner);
  if (state.search) {
    const s = state.search.toLowerCase();
    list = list.filter(a => (a.parent||'').includes(state.search) || (a.id||'').toLowerCase().includes(s) || (a.child||'').includes(state.search));
  }
  if (state.sort === 'urgent') {
    const order = { urgent: 0, soon: 1, ok: 2 };
    list.sort((a,b) => (order[a.deadlineState]??9) - (order[b.deadlineState]??9));
  } else if (state.sort === 'prob') {
    list.sort((a,b) => b.probability - a.probability);
  } else {
    list.sort((a,b) => (a.receivedAt||'').localeCompare(b.receivedAt||''));
  }
  return list;
}

function render() {
  const apps = getApps();
  document.getElementById('count-chip').textContent = `전체 ${apps.length}건`;

  const grid = document.getElementById('list-grid');
  const listArea = document.getElementById('list-area');
  const detailArea = document.getElementById('detail-area');

  if (state.layout === 'kanban') {
    grid.classList.add('full');
    detailArea.style.display = 'none';
    listArea.innerHTML = renderKanbanView(apps);
  } else {
    grid.classList.remove('full');
    detailArea.style.display = '';
    if (state.layout === 'table') listArea.innerHTML = renderTableView(apps);
    else listArea.innerHTML = renderCardView(apps);

    const sel = apps.find(a => a.id === state.selectedId) || APPS.find(a => a.id === state.selectedId) || null;
    detailArea.innerHTML = renderDetailPanel(sel);
  }
}
