<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자란다 매칭 운영 툴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F5F4F0;
  --surface: #FFFFFF;
  --surface2: #F0EFEb;
  --border: #E2E0DA;
  --border2: #CCCAC3;
  --text: #1A1917;
  --text2: #6B6861;
  --text3: #9E9C97;
  --green: #1D9E75;
  --green-bg: #E1F5EE;
  --green-text: #085041;
  --amber: #BA7517;
  --amber-bg: #FAEEDA;
  --amber-text: #633806;
  --red: #A32D2D;
  --red-bg: #FCEBEB;
  --red-text: #791F1F;
  --blue: #185FA5;
  --blue-bg: #E6F1FB;
  --blue-text: #0C447C;
  --gray-bg: #F1EFE8;
  --gray-text: #444441;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
  --radius: 8px;
  --radius-lg: 12px;
}

html, body {
  height: 100%;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
}

/* LAYOUT */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 52px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.brand {
  background: #085041; color: #9FE1CB;
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  padding: 3px 10px; border-radius: 6px;
}
.page-title { font-size: 15px; font-weight: 600; }
.page-sub { font-size: 12px; color: var(--text2); }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.topbar-meta { font-size: 12px; color: var(--text3); }

.main { display: flex; flex: 1; overflow: hidden; }

/* LIST PANEL */
.list-panel {
  width: 100%;
  display: flex; flex-direction: column;
  overflow: hidden;
}

.list-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.list-header-left { display: flex; align-items: center; gap: 8px; }
.list-count { font-size: 12px; color: var(--text2); }

.tbl-scroll { overflow-y: auto; flex: 1; }

table { width: 100%; border-collapse: collapse; background: var(--surface); }
thead { position: sticky; top: 0; z-index: 2; background: var(--surface); }
th {
  font-size: 11px; font-weight: 500; color: var(--text2);
  padding: 8px 10px; text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap; user-select: none;
}
th:first-child { padding-left: 20px; }
td {
  padding: 10px 10px; border-bottom: 1px solid var(--border);
  vertical-align: middle; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
td:first-child { padding-left: 20px; }
tbody tr { cursor: pointer; transition: background .1s; }
tbody tr:hover { background: #F8F7F4; }
tbody tr.active { background: var(--green-bg) !important; }
tbody tr:last-child td { border-bottom: none; }

/* BADGES */
.bdg {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 500; padding: 2px 8px;
  border-radius: 99px; white-space: nowrap;
}
.bdg-완료 { background: var(--green-bg); color: var(--green-text); }
.bdg-진행 { background: var(--blue-bg); color: var(--blue-text); }
.bdg-미배정 { background: var(--gray-bg); color: var(--gray-text); }
.bdg-취소 { background: var(--red-bg); color: var(--red-text); }
.bdg-이용 { background: var(--amber-bg); color: var(--amber-text); }
.bdg-신규 { background: var(--gray-bg); color: var(--gray-text); }

.sid { font-family: var(--mono); font-size: 11px; color: var(--text2); font-weight: 500; }

.timer { font-weight: 600; font-size: 12px; }
.timer-r { color: var(--red); }
.timer-a { color: var(--amber); }
.timer-g { color: var(--green); }
.timer-none { color: var(--text3); }

.prob-wrap { display: flex; align-items: center; gap: 5px; }
.prob-bar { width: 44px; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; flex-shrink: 0; }
.prob-fill { height: 100%; border-radius: 99px; }
.prob-val { font-size: 12px; font-weight: 500; }

/* DETAIL PANEL */
/* CARD-ROW STRIP */
.row-strip-header {
  display: grid;
  grid-template-columns: 1.5fr 1.3fr 0.85fr 1.45fr 1.45fr 0.7fr 1.1fr 1.15fr;
  gap: 6px; padding: 6px 14px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  font-size: 10px; font-weight: 600; color: var(--text3);
  letter-spacing: .06em; text-transform: uppercase;
  position: sticky; top: 0; z-index: 2;
}
.rsh { padding: 0 8px; }

.rows-scroll { overflow-y: auto; flex: 1; }
.data-rows { display: flex; flex-direction: column; }

.data-row {
  display: grid;
  grid-template-columns: 1.5fr 1.3fr 0.85fr 1.45fr 1.45fr 0.7fr 1.1fr 1.15fr;
  gap: 6px; padding: 8px 14px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  cursor: pointer;
  min-height: 70px;
  transition: background .12s;
}
.data-row:hover { background: var(--surface2); }
.data-row.active { background: var(--green-bg); border-bottom-color: transparent; }

.rcard {
  padding: 8px 10px; border-radius: 8px;
  font-size: 11px; line-height: 1.4;
  display: flex; flex-direction: column; gap: 2px;
  min-width: 0; overflow: hidden;
}
.rcard-app { background: #E1F5EE; }
.rcard-history { background: #FAEEDA; }
.rcard-rec { background: #FAEEDA; }
.rcard-teacher { background: #F2F4B0; }
.rcard-teacher.empty {
  background: transparent;
  border: 1px dashed var(--border2);
  align-items: center; justify-content: center;
}
.rcard-teacher.empty::before {
  content: '미지원'; color: var(--text3); font-size: 11px;
}
.rcard-more {
  background: var(--surface2);
  align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: var(--text);
}
.rcard-more.zero { color: var(--text3); font-weight: 400; }

.viewed-pill {
  display: inline-block; font-size: 10px; font-weight: 500;
  padding: 1px 6px; border-radius: 99px;
}
.viewed-pill.on { background: var(--green); color: #fff; }
.viewed-pill.off { background: var(--surface2); color: var(--text3); }

/* DETAIL 4-CARDS */
.detail-4-cards {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
}
@media (max-width: 1100px) {
  .detail-4-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.dcard {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 12px;
  min-width: 0;
}
.dcard-title {
  font-size: 11px; font-weight: 600; color: var(--text2);
  letter-spacing: .06em; text-transform: uppercase;
  margin-bottom: 10px;
}

/* Timeline sub event (부모님 앱 로그인 등) */
.tl-item.sub { padding-left: 22px; padding-bottom: 8px; }
.tl-item.sub .tl-dot { width: 6px; height: 6px; margin-top: 4px; opacity: .7; }
.tl-item.sub .tl-line { background: var(--border2); opacity: .6; }
.tl-item.sub .tl-action { font-size: 11px; color: var(--text2); font-weight: 400; }
.tl-item.sub .tl-time { font-size: 10px; }
.tl-item.sub .tl-detail { font-size: 10px; color: var(--text3); }

/* TEACHER DETAIL CARD */
.teacher-cards-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.teacher-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.tc-header { display: flex; align-items: center; gap: 10px; }
.tc-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--green-bg); color: var(--green-text);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 14px; flex-shrink: 0;
}
.tc-name-block { flex: 1; min-width: 0; }
.tc-name { font-size: 13px; font-weight: 600; }
.tc-stat { font-size: 11px; color: var(--text2); margin-top: 2px; }
.tc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tc-stat-item {
  background: var(--surface); border-radius: var(--radius);
  padding: 8px 10px;
}
.tc-stat-lbl { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
.tc-stat-val { font-size: 13px; font-weight: 600; color: var(--text); }
.tc-stat-val .star { color: var(--amber); }

.link-original {
  font-size: 12px; color: var(--blue); text-decoration: none;
  padding: 4px 10px; border: 1px solid var(--blue);
  border-radius: var(--radius); margin-left: 8px;
}
.link-original:hover { background: var(--blue-bg); }
.rcard-result { background: #D4EDE4; }
.rcard-action { background: #E6F1FB; }

.rc-title { font-size: 12px; font-weight: 600; color: var(--text); }
.rc-sub { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-meta { font-size: 10px; color: var(--text3); }
.rc-row-flex { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rc-num { font-weight: 600; color: var(--text); }
.rc-num-mute { color: var(--text3); }
.rc-stat-ok { color: var(--green-text); font-weight: 500; }
.rc-stat-warn { color: var(--amber-text); font-weight: 500; }
.rc-stat-bad { color: var(--red-text); font-weight: 500; }
.rc-stat-mute { color: var(--text3); }

.detail-block {
  background: var(--surface);
  border-top: 1px solid var(--green);
  border-bottom: 1px solid var(--border);
}
.detail-inline { display: flex; flex-direction: column; }
.detail-inline .dp-header,
.detail-inline .insight-box,
.detail-inline .dp-section,
.detail-inline .action-btns,
.detail-inline .memo-area { padding-left: 24px; padding-right: 24px; }
.detail-inline .insight-box { margin-left: 24px; margin-right: 24px; padding-left: 12px; padding-right: 12px; }

.dp-header {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.dp-header-top { display: flex; justify-content: space-between; align-items: flex-start; }
.dp-title { font-size: 15px; font-weight: 600; }
.dp-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }

.dp-scroll { flex: 1; overflow-y: auto; }

.dp-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.sec-lbl {
  font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 10px;
}

/* INSIGHT BOX */
.insight-box {
  margin: 12px 18px 0;
  padding: 10px 12px;
  border-left: 3px solid var(--green);
  background: var(--green-bg);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.insight-box.warn { border-left-color: var(--amber); background: var(--amber-bg); }
.insight-box.danger { border-left-color: var(--red); background: var(--red-bg); }
.insight-lbl { font-size: 11px; font-weight: 600; color: var(--green-text); margin-bottom: 3px; }
.insight-box.warn .insight-lbl { color: var(--amber-text); }
.insight-box.danger .insight-lbl { color: var(--red-text); }
.insight-txt { font-size: 12px; color: var(--green-text); line-height: 1.55; }
.insight-box.warn .insight-txt { color: var(--amber-text); }
.insight-box.danger .insight-txt { color: var(--red-text); }

/* INFO ROWS */
.info-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.info-key { font-size: 12px; color: var(--text2); flex-shrink: 0; }
.info-val { font-size: 12px; font-weight: 500; color: var(--text); text-align: right; }

/* TEACHER ROWS */
.teacher-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--border);
}
.teacher-row:last-child { border-bottom: none; }
.t-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; flex-shrink: 0;
}
.t-name { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; }
.t-stat { font-size: 11px; color: var(--text2); }
.t-resp { font-size: 11px; font-weight: 500; margin-left: auto; white-space: nowrap; }

/* TIMELINE */
.tl-item { display: flex; gap: 10px; padding-bottom: 12px; position: relative; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot-col { display: flex; flex-direction: column; align-items: center; width: 14px; flex-shrink: 0; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; }
.tl-line { flex: 1; width: 1px; background: var(--border); margin-top: 4px; min-height: 12px; }
.tl-item:last-child .tl-line { display: none; }
.tl-content { flex: 1; min-width: 0; }
.tl-action { font-size: 12px; font-weight: 500; }
.tl-time { font-size: 11px; color: var(--text3); margin-top: 1px; }
.tl-detail { font-size: 11px; color: var(--text2); margin-top: 3px; line-height: 1.4; }

/* MEMO */
.memo-area { padding: 14px 18px; flex-shrink: 0; border-top: 1px solid var(--border); }
.memo-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.memo-item { background: var(--bg); border-radius: var(--radius); padding: 8px 10px; }
.memo-who { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
.memo-txt { font-size: 12px; color: var(--text); line-height: 1.55; }
.memo-empty { font-size: 12px; color: var(--text3); margin-bottom: 10px; }
.memo-input-row { display: flex; gap: 8px; align-items: flex-end; }
.memo-input-row textarea {
  flex: 1; font-size: 12px; font-family: var(--sans);
  min-height: 54px; padding: 8px 10px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
  resize: none; outline: none;
  transition: border-color .15s;
}
.memo-input-row textarea:focus { border-color: var(--green); }
.btn-save {
  height: 32px; padding: 0 14px; font-size: 12px; font-family: var(--sans);
  background: var(--green); color: #fff; border: none;
  border-radius: var(--radius); cursor: pointer; font-weight: 500;
  white-space: nowrap; flex-shrink: 0;
  transition: opacity .15s;
}
.btn-save:hover { opacity: .88; }

/* BTN */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 12px; font-size: 12px; font-family: var(--sans);
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border2); border-radius: var(--radius);
  cursor: pointer; font-weight: 500; white-space: nowrap;
  transition: background .1s, border-color .1s;
}
.btn:hover { background: var(--surface2); border-color: var(--border2); }
.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: #0F6E56; border-color: #0F6E56; }
.btn-close {
  background: none; border: none; cursor: pointer; color: var(--text3);
  font-size: 18px; line-height: 1; padding: 2px 4px;
  border-radius: 4px; transition: color .1s, background .1s;
}
.btn-close:hover { color: var(--text); background: var(--surface2); }

.filter-select {
  height: 30px; padding: 0 26px 0 10px; font-size: 12px; font-family: var(--sans);
  background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%236B6861' d='M0 0l5 6 5-6z'/></svg>") no-repeat right 10px center;
  color: var(--text); border: 1px solid var(--border2); border-radius: var(--radius);
  cursor: pointer; font-weight: 500; appearance: none;
}
.filter-select:hover { background-color: var(--surface2); }
.filter-select:focus { outline: none; border-color: var(--green); }

.action-btns { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); flex-shrink: 0; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* EMPTY */
.no-teacher { font-size: 12px; color: var(--text3); padding: 4px 0; }

/* TABS */
.tabs { display: flex; gap: 2px; margin-left: 4px; }
.tab {
  background: transparent; border: none; cursor: pointer;
  padding: 6px 12px; border-radius: 6px;
  font-size: 13px; font-weight: 500; color: var(--text2);
  font-family: var(--sans);
}
.tab:hover { background: var(--surface2); color: var(--text); }
.tab.active { background: #085041; color: #fff; }

/* PAGES */
.page { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* INSIGHT PAGE */
.page-insight { display: none; overflow-y: auto; background: var(--bg); }
.page-insight.active { display: flex; }

.insight-head { padding: 20px 24px 12px; flex-shrink: 0; }
.insight-head h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.insight-head p { font-size: 12px; color: var(--text2); }

.insight-grid {
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px;
  padding: 0 24px 16px;
}
@media (max-width: 1100px) { .insight-grid { grid-template-columns: 1fr; } }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px;
}
.card + .card { margin-top: 12px; }

.memo-write select, .memo-write textarea,
.feed-filters select {
  font-family: var(--sans); font-size: 12px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  padding: 6px 10px; background: var(--surface); color: var(--text);
}
.memo-write textarea {
  width: 100%; min-height: 64px; resize: vertical; line-height: 1.5;
}
.memo-write textarea:focus, .memo-write select:focus,
.feed-filters select:focus { outline: none; border-color: var(--green); }
.memo-write-row { display: flex; gap: 8px; align-items: center; }

.feed-filters { display: flex; gap: 6px; flex-wrap: wrap; }

.memo-feed-list { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; }
.feed-item {
  background: var(--bg); border-radius: var(--radius);
  padding: 10px 12px; border-left: 3px solid var(--border2);
}
.feed-item.tag-지역 { border-left-color: var(--blue); }
.feed-item.tag-신규부모님 { border-left-color: var(--amber); }
.feed-item.tag-재이용 { border-left-color: var(--green); }
.feed-item.tag-응답속도 { border-left-color: var(--red); }
.feed-item.tag-신청서 { border-left-color: var(--text3); }
.feed-meta { display: flex; gap: 8px; font-size: 11px; color: var(--text3); margin-bottom: 4px; align-items: center; }
.feed-meta .tag-pill {
  background: var(--surface2); color: var(--text2);
  padding: 1px 6px; border-radius: 99px; font-weight: 500;
}
.feed-meta .source-pill {
  font-family: var(--mono); color: var(--text2);
}
.feed-txt { font-size: 12px; line-height: 1.55; color: var(--text); }

.insight-empty { font-size: 12px; color: var(--text3); padding: 16px 0; text-align: center; }
.insight-loading { font-size: 12px; color: var(--text2); padding: 16px 0; text-align: center; }

.toplines { display: flex; flex-direction: column; gap: 4px; }
.topline {
  font-size: 12px; color: var(--text); padding: 6px 10px;
  background: var(--surface2); border-radius: var(--radius);
}
.theme-list { display: flex; flex-direction: column; gap: 10px; }
.theme-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; background: var(--bg);
}
.theme-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.theme-title { font-size: 13px; font-weight: 600; }
.theme-count {
  font-size: 11px; background: var(--green-bg); color: var(--green-text);
  padding: 2px 8px; border-radius: 99px; font-weight: 500;
}
.theme-summary { font-size: 12px; color: var(--text2); line-height: 1.55; margin-bottom: 6px; }
.theme-action { font-size: 12px; color: var(--text); padding: 6px 8px; background: var(--surface); border-radius: var(--radius); }
.theme-action strong { color: var(--green-text); margin-right: 4px; font-weight: 600; }
.derive-meta { font-size: 11px; color: var(--text3); padding-top: 8px; border-top: 1px solid var(--border); margin-top: 8px; }

.history-list { display: flex; flex-direction: column; gap: 8px; }
.history-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.history-item-left { display: flex; flex-direction: column; gap: 2px; }
.history-item-title { font-size: 12px; font-weight: 500; }
.history-item-meta { font-size: 11px; color: var(--text3); }
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="brand">자란다 OPS</span>
      <nav class="tabs">
        <button class="tab active" data-page="matching" onclick="switchPage('matching')">매칭 신청서 관리</button>
        <button class="tab" data-page="insight" onclick="switchPage('insight')">인사이트 도출</button>
      </nav>
    </div>
    <div class="topbar-right">
      <span class="topbar-meta" id="live-time"></span>
      <button class="btn btn-primary" id="new-app-btn" onclick="alert('신규 신청서 등록 화면 (구현 예정)')">+ 신규 신청서</button>
    </div>
  </div>

  <div class="main">

  <!-- ============== PAGE: MATCHING ============== -->
  <section class="page page-matching" id="page-matching">

    <!-- LIST PANEL -->
    <div class="list-panel" id="list-panel">
      <div class="list-header">
        <div class="list-header-left">
          <span style="font-size:13px;font-weight:600">전체 신청서</span>
          <span class="list-count" id="list-count">5건</span>
          <select class="filter-select" id="assignee-filter" onchange="filterByAssignee(this.value)">
            <option value="">담당자 전체</option>
          </select>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn" onclick="sortBy('timer')">⏱ 취소임박순</button>
          <button class="btn" onclick="sortBy('prob')">📊 확률높은순</button>
          <button class="btn" onclick="sortBy('date')">🕐 접수순</button>
        </div>
      </div>

      <div class="row-strip-header">
        <div class="rsh">신청서</div>
        <div class="rsh">고객 이력</div>
        <div class="rsh">추천 log</div>
        <div class="rsh">선생님 1</div>
        <div class="rsh">선생님 2</div>
        <div class="rsh">추가 지원</div>
        <div class="rsh">결과</div>
        <div class="rsh">최근 액션</div>
      </div>
      <div class="rows-scroll">
        <div class="data-rows" id="data-rows"></div>
      </div>
    </div>

  </section>

  <!-- ============== PAGE: INSIGHT ============== -->
  <section class="page page-insight" id="page-insight">
    <div class="insight-head">
      <h2>인사이트 도출</h2>
      <p>담당자 메모를 모아 LLM이 패턴·시사점을 도출합니다.</p>
    </div>

    <div class="insight-grid">

      <!-- LEFT: 메모 입력 + 피드 -->
      <div>
        <div class="card memo-write">
          <div class="sec-lbl">메모 작성</div>
          <div class="memo-write-row">
            <select id="memo-author"></select>
            <select id="memo-tag">
              <option value="지역">지역</option>
              <option value="신규부모님">신규부모님</option>
              <option value="재이용">재이용</option>
              <option value="응답속도">응답속도</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <textarea id="memo-text" placeholder="떠오르는 생각, 패턴, 가설을 자유롭게 적어주세요..."></textarea>
          <div style="display:flex;justify-content:flex-end">
            <button class="btn btn-primary" onclick="addGlobalMemo()">메모 저장</button>
          </div>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
            <div class="sec-lbl" style="margin:0">메모 피드 <span id="feed-count" style="color:var(--text2);font-weight:400;text-transform:none;letter-spacing:0">· 0건</span></div>
            <div class="feed-filters">
              <select id="filter-author" onchange="renderMemoFeed()"><option value="">작성자 전체</option></select>
              <select id="filter-tag" onchange="renderMemoFeed()">
                <option value="">태그 전체</option>
                <option value="지역">지역</option>
                <option value="신규부모님">신규부모님</option>
                <option value="재이용">재이용</option>
                <option value="응답속도">응답속도</option>
                <option value="신청서">신청서</option>
                <option value="기타">기타</option>
              </select>
              <select id="filter-source" onchange="renderMemoFeed()">
                <option value="">출처 전체</option>
                <option value="자유">자유 메모</option>
                <option value="신청서">신청서 메모</option>
              </select>
            </div>
          </div>
          <div class="memo-feed-list" id="memo-feed-list"></div>
        </div>
      </div>

      <!-- RIGHT: LLM 인사이트 -->
      <div>
        <div class="card">
          <div class="sec-lbl">LLM 인사이트 도출</div>
          <div style="font-size:12px;color:var(--text2);line-height:1.55">
            현재 피드에 표시된 메모 <strong id="derive-count">0</strong>건을 묶어 테마 클러스터·핵심 인사이트·제안 액션을 생성합니다.
          </div>
          <div>
            <button class="btn btn-primary" onclick="deriveInsights()">인사이트 도출하기</button>
          </div>
        </div>

        <div class="card" id="insight-result">
          <div class="insight-empty">메모를 모아 "인사이트 도출하기"를 눌러주세요.</div>
        </div>
      </div>

    </div>

    <div class="insight-grid" style="grid-template-columns:1fr">
      <div class="card">
        <div class="sec-lbl">인사이트 히스토리</div>
        <div class="history-list" id="history-list"></div>
      </div>
    </div>

  </section>

  </div>
</div>

function timerClass(min) {
  if (min === null) return 'timer-none';
  if (min < 120) return 'timer-r';
  if (min < 240) return 'timer-a';
  return 'timer-g';
}

function timerLabel(min) {
  if (min === null) return '—';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function probColor(p) {
  if (p >= 70) return '#1D9E75';
  if (p >= 45) return '#BA7517';
  return '#A32D2D';
}

function statusBdg(status) {
  const map = {

  };
  return `<span class="bdg ${map[status]||''}">${status}</span>`;
}

function confirmTeacher(key, teacherName) {
  const d = ROWS.find(r => r.key === key);
  if (!d) return;
  const responded = d.teachers.filter(t => t.stat.includes('수락') || t.stat.includes('응답완료'));
  if (teacherName) {
    alert(`[${d.sid}] 부모님께 "${teacherName} 선생님 확정 요청" 알림톡 발송 (구현 예정)`);
  } else if (responded.length === 0) {
    alert('지원·수락한 선생님이 없습니다.');
  } else {
    const list = responded.map(t => t.name).join(', ');
    alert(`[${d.sid}] 부모님께 지원 선생님 ${responded.length}명(${list}) 중 선택 요청 알림톡 발송 (구현 예정)`);
  }
}

function applyFilterSort() {
  let rows = [...ROWS];
  if (currentFilter) {
    rows = rows.filter(r => r.assignee === currentFilter);
  }
  if (currentSort === 'timer') {
    rows.sort((a,b) => {
      if (a.timerMin === null && b.timerMin === null) return 0;
      if (a.timerMin === null) return 1;
      if (b.timerMin === null) return -1;
      return a.timerMin - b.timerMin;
    });
  } else if (currentSort === 'prob') {
    rows.sort((a,b) => b.prob - a.prob);
  }
  sortedRows = rows;
  document.getElementById('list-count').textContent = `${rows.length}건`;
  renderTable();
}

function sortBy(type) {
  currentSort = type;
  applyFilterSort();
}

function filterByAssignee(value) {
  currentFilter = value;
  applyFilterSort();
}

      action: '신규 가입자는 카카오 알림톡 우선 + 30분 미반응 시 자동 SMS 백업 채널 전환',
    },
    {
      title: '재이용 고객 매칭 성공률 ↑',
      count: 1,
      summary: '재이용 7회 이상 고객은 매칭 성공률 90%+. 담당자 개입 없이도 매칭이 빠르게 종결되는 경향.',
      action: '재이용 횟수 기반 자동 처리 룰 검토 (담당자 배정 자동화 / SLA 단축)',
    },
    {
      title: '미응답 자동 추가 발송 룰 부재',
      count: 1,
      summary: '담당자가 수동으로 추가 발송을 모니터링 — 야간/주말에 누락 가능성. 룰 기반 자동화 의견 반복.',
      action: '미응답 30분 초과 시 가용 선생님 1명 자동 추가 발송 (최대 2회) PoC',
    },
  ],
};

// ====== PAGE SWITCH ======
function switchPage(page) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.page === page));
  document.getElementById('page-matching').style.display = (page === 'matching') ? 'flex' : 'none';
  document.getElementById('page-insight').classList.toggle('active', page === 'insight');
  document.getElementById('new-app-btn').style.display = (page === 'matching') ? '' : 'none';
  if (page === 'insight') {
    populateInsightFilters();
    renderMemoFeed();
    renderInsightHistory();
  }
}

function populateInsightFilters() {
  const author = document.getElementById('memo-author');
  if (author && author.options.length <= 1) {
    author.innerHTML = ASSIGNEES.map(a => `<option value="${a}">${a}</option>`).join('');
  }
  const fauthor = document.getElementById('filter-author');
  if (fauthor && fauthor.options.length <= 1) {
    fauthor.innerHTML = '<option value="">작성자 전체</option>' +
      ASSIGNEES.map(a => `<option value="${a}">${a}</option>`).join('');
  }
}

function buildIntegratedFeed() {
  const feed = globalMemos.map(m => ({...m, source: '자유', sourceLabel: '자유 메모'}));
  Object.entries(memoStore).forEach(([key, memos]) => {
    const row = ROWS.find(r => r.key === key);
    const sid = row ? row.sid : '';
    memos.forEach((m, i) => {
      const parts = m.who.split('·').map(s => s.trim());
      feed.push({
        id: `${key}-${i}`,
        who: parts[0] || '',
        ts: parts[1] || '',
        tag: '신청서',
        txt: m.txt,
        source: '신청서',
        sourceLabel: sid,
      });
    });
  });
  feed.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  return feed;
}

function renderMemoFeed() {
  const fAuthor = document.getElementById('filter-author').value;
  const fTag = document.getElementById('filter-tag').value;
  const fSource = document.getElementById('filter-source').value;
  let feed = buildIntegratedFeed();
  if (fAuthor) feed = feed.filter(f => f.who === fAuthor);
  if (fTag) feed = feed.filter(f => f.tag === fTag);
  if (fSource) feed = feed.filter(f => f.source === fSource);

  document.getElementById('feed-count').textContent = `· ${feed.length}건`;
  document.getElementById('derive-count').textContent = feed.length;

  const el = document.getElementById('memo-feed-list');
  if (feed.length === 0) {
    el.innerHTML = '<div class="insight-empty">조건에 맞는 메모가 없습니다.</div>';
    return;
  }
  el.innerHTML = feed.map(f => `
    <div class="feed-item tag-${f.tag}">
      <div class="feed-meta">
        <strong style="color:var(--text)">${f.who || '익명'}</strong>
        <span>${f.ts || ''}</span>
        <span class="tag-pill">${f.tag}</span>
        <span class="source-pill">${f.sourceLabel}</span>
      </div>
      <div class="feed-txt">${f.txt}</div>
    </div>
  `).join('');
}

function addGlobalMemo() {
  const who = document.getElementById('memo-author').value;
  const tag = document.getElementById('memo-tag').value;
  const ta = document.getElementById('memo-text');
  const txt = ta.value.trim();
  if (!txt) return;
  const now = new Date();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const hh = String(now.getHours()).padStart(2,'0');
  const mi = String(now.getMinutes()).padStart(2,'0');
  globalMemos.unshift({
    id: 'g' + Date.now(),
    who, tag,
    ts: `${mm}/${dd} ${hh}:${mi}`,
    txt,
  });
  ta.value = '';
  renderMemoFeed();
}

function deriveInsights() {
  const el = document.getElementById('insight-result');
  el.innerHTML = '<div class="insight-loading">메모 분석 중...</div>';
  setTimeout(() => {
    const totalMemos = document.getElementById('derive-count').textContent;
    el.innerHTML = `
      <div class="sec-lbl">핵심 인사이트</div>
      <div class="toplines">
        ${INSIGHT_MOCK.toplines.map(t => `<div class="topline">• ${t}</div>`).join('')}
      </div>
      <div class="sec-lbl" style="margin-top:6px">테마 클러스터</div>
      <div class="theme-list">
        ${INSIGHT_MOCK.themes.map(t => `
          <div class="theme-card">
            <div class="theme-header">
              <div class="theme-title">${t.title}</div>
              <span class="theme-count">${t.count}건</span>
            </div>
            <div class="theme-summary">${t.summary}</div>
            <div class="theme-action"><strong>제안 액션</strong> ${t.action}</div>
          </div>
        `).join('')}
      </div>
      <div class="derive-meta">도출 시각: ${new Date().toLocaleString('ko-KR')} · 분석 모델: Claude (mock) · 입력 메모 ${totalMemos}건</div>
    `;
    INSIGHT_HISTORY.unshift({
      title: '메모 클러스터링 (자동)',
      ts: new Date().toLocaleString('ko-KR'),
      memos: parseInt(totalMemos, 10) || 0,
      themes: INSIGHT_MOCK.themes.length,
    });
    renderInsightHistory();
  }, 700);
}

function renderInsightHistory() {
  const el = document.getElementById('history-list');
  if (!el) return;
  el.innerHTML = INSIGHT_HISTORY.map(h => `
    <div class="history-item">
      <div class="history-item-left">
        <div class="history-item-title">${h.title}</div>
        <div class="history-item-meta">${h.ts} · 메모 ${h.memos}건 · 테마 ${h.themes}개</div>
      </div>
      <button class="btn" onclick="alert('과거 인사이트 다시 보기 (구현 예정)')">보기</button>
    </div>
  `).join('');
}

function renderAssigneeFilter() {
  const sel = document.getElementById('assignee-filter');
  sel.innerHTML = '<option value="">담당자 전체</option>' +
    ASSIGNEES.map(a => `<option value="${a}">${a}</option>`).join('');
}

function toggleDetail(key) {
  currentKey = (currentKey === key) ? null : key;
  renderTable();
  if (currentKey) {
    const row = document.getElementById('row-' + key);
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function addMemoInline(key) {
  const ta = document.getElementById('memo-input-' + key);
  if (!ta) return;
  const txt = ta.value.trim();
  if (!txt) return;
  const now = new Date();
  const hm = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  const assigneeMap = {A:'신진섭',B:'김지윤',C:'노태효',D:'김성환',E:'이승석'};
  if (!memoStore[key]) memoStore[key] = [];
  memoStore[key].push({ who: `${assigneeMap[key]} · ${hm}`, txt });
  renderTable();
}

function updateTime() {
  const now = new Date();
  document.getElementById('live-time').textContent =
    now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}) + ' ' +
    now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}

renderAssigneeFilter();
renderTable();
updateTime();
setInterval(updateTime, 30000);
</script>
